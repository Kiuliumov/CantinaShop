[tox]
env_list = py312, lint, format
skipsdist = true

[testenv:py312]
description = Run pytest suites
skip_install = true
deps = -r requirements-dev.txt
commands = python -m pytest {posargs}

[testenv:lint]
description = Run Flake8
skip_install = true
deps =
    flake8
commands =
    flake8 .

[testenv:format]
description = Check code formatting
skip_install = true
deps =
    black
    isort
commands =
    black --check --workers 1 --line-length 120 .
    isort --check-only --profile black --line-length 120 .

[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude =
    .git,
    .tox,
    .venv,
    venv,
    migrations

[isort]
profile = black
line_length = 120
skip =
    .tox,
    .venv,
    venv,
    migrations
