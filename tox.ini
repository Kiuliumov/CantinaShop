[tox]
env_list = lint, format
skipsdist = true

[testenv:lint]
description = Run Flake8
skip_install = true
deps =
    flake8
commands =
    flake8 .

[testenv:format]
description = Check code formatting
skip_install = true
deps =
    black
    isort
commands =
    black --check --line-length 120 .
    isort --check-only --profile black --line-length 120 .

[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude =
    .git,
    .tox,
    .venv,
    migrations

[isort]
profile = black
line_length = 120
skip =
    .tox,
    .venv,
    migrations
