name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tox
        run: python -m pip install tox
      - name: Run pytest suites
        run: tox -e py312

  lint:
    name: Lint and Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tox
        run: python -m pip install tox

      - name: Run Flake8, Black and isort
        run: tox -e lint,format
